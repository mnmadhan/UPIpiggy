<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — UPI Savings Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0a0f;--gold:#c9a84c;--teal:#1a7c6e;--paper:#f5f3ee;--muted:#7a7570;--border:rgba(10,10,15,.12)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;bottom:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(26,124,110,.25),transparent 70%)}
    .card{background:var(--paper);border-radius:28px;padding:52px 44px;width:100%;max-width:420px;text-align:center;position:relative;z-index:1;animation:slideUp .5s ease both}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .card-icon{width:70px;height:70px;border-radius:20px;background:var(--ink);display:grid;place-items:center;font-size:28px;margin:0 auto 24px}
    .card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;color:var(--ink);margin-bottom:8px}
    .card-sub{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:32px}
    .field{margin-bottom:16px;text-align:left}
    .field label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.07em;color:var(--ink);margin-bottom:8px;text-transform:uppercase}
    .field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;font-family:'DM Sans',sans-serif;background:white;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,124,110,.12)}
    .field input::placeholder{color:#bbb}
    .submit-btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--ink);color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .25s;margin-bottom:16px}
    .submit-btn:hover{background:#1a1a2e;transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,10,15,.2)}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .back-link{font-size:.85rem;color:var(--muted)}
    .back-link a{color:var(--teal);font-weight:600;text-decoration:none}
    .msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;text-align:left;display:none}
    .msg.error{background:#fee2e2;color:#991b1b;display:block}
    .msg.success{background:#d1fae5;color:#065f46;display:block}
    .strength-bar{height:4px;background:#eee;border-radius:2px;margin-top:8px;overflow:hidden}
    .strength-fill{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-icon">🔒</div>
    <h2 class="card-title">New Password</h2>
    <p class="card-sub">Enter the OTP from your email and choose a strong new password for your account.</p>
    <div class="msg" id="msg"></div>
    <form id="resetForm">
      <div class="field">
        <label>OTP Code</label>
        <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" required>
      </div>
      <div class="field">
        <label>New Password</label>
        <input type="password" id="newPwd" name="newPassword" placeholder="Min. 8 characters" required>
        <div class="strength-bar"><div class="strength-fill" id="sf"></div></div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confPwd" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Reset Password →</button>
    </form>
    <p class="back-link"><a href="/login">← Back to login</a></p>
  </div>
  <script>
    const colors=['#ef4444','#f97316','#eab308','#22c55e'];
    document.getElementById('newPwd').addEventListener('input',function(){
      const v=this.value; let s=0;
      if(v.length>=8)s++; if(/[A-Z]/.test(v))s++; if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
      const f=document.getElementById('sf'); f.style.width=(s*25)+'%'; f.style.background=colors[s-1]||'#eee';
    });
    document.getElementById('resetForm').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const msg=document.getElementById('msg'); msg.className='msg';
      if(document.getElementById('newPwd').value!==document.getElementById('confPwd').value){
        msg.textContent='Passwords do not match.'; msg.classList.add('error'); return;
      }
      const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Resetting...';
      try {
        const res=await fetch('/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({otp:document.getElementById('otp').value,newPassword:document.getElementById('newPwd').value})});
        const data=await res.json();
        msg.textContent=data.message; msg.classList.add(data.success?'success':'error');
        if(data.success) setTimeout(()=>window.location.href='/login',1500);
        else{btn.disabled=false;btn.textContent='Reset Password →';}
      } catch(err){ msg.textContent='Something went wrong.'; msg.classList.add('error'); btn.disabled=false; btn.textContent='Reset Password →'; }
    });
  </script>
</body>
</html>
