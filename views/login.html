<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — UPI Savings Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0a0a0f; --gold:#c9a84c; --teal:#1a7c6e; --teal-light:#2db89f; --paper:#f5f3ee; --muted:#7a7570; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--ink);color:white;overflow:hidden}
    .left{display:flex;flex-direction:column;justify-content:space-between;padding:48px;background:linear-gradient(160deg,#0e1117 0%,#0a1a1a 100%);position:relative;overflow:hidden}
    .left::before{content:'';position:absolute;bottom:-80px;left:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(26,124,110,.35) 0%,transparent 70%);pointer-events:none}
    .left::after{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.2) 0%,transparent 70%);pointer-events:none}
    .logo{display:flex;align-items:center;gap:12px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:white;text-decoration:none;position:relative;z-index:1}
    .logo-icon{width:38px;height:38px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-size:18px;color:var(--ink)}
    .left-middle{position:relative;z-index:1}
    .left-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.4rem,3.5vw,3.2rem);line-height:1.05;letter-spacing:-.03em}
    .left-title span{color:var(--gold)}
    .left-sub{margin-top:16px;color:rgba(255,255,255,.45);line-height:1.7;font-size:.95rem}
    .left-stats{display:flex;gap:32px;position:relative;z-index:1}
    .left-stat-num{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--teal-light)}
    .left-stat-label{font-size:.78rem;color:rgba(255,255,255,.35);margin-top:2px}

    .right{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:48px}
    .form-box{width:100%;max-width:380px}
    .form-title{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:var(--ink);margin-bottom:8px}
    .form-subtitle{font-size:.88rem;color:var(--muted);margin-bottom:40px}
    .form-subtitle a{color:var(--teal);font-weight:600;text-decoration:none}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--ink);margin-bottom:8px;text-transform:uppercase}
    .field input{width:100%;padding:14px 18px;border:1.5px solid rgba(10,10,15,.12);border-radius:14px;font-size:.95rem;font-family:'DM Sans',sans-serif;background:white;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,124,110,.12)}
    .field input::placeholder{color:#bbb}

    .form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .forgot{font-size:.85rem;color:var(--teal);text-decoration:none;font-weight:500}
    .forgot:hover{text-decoration:underline}

    .submit-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--ink);color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all .25s;letter-spacing:.02em}
    .submit-btn:hover:not(:disabled){background:#1a1a2e;transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,10,15,.2)}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

    .signup-link{text-align:center;font-size:.88rem;color:var(--muted);margin-top:24px}
    .signup-link a{color:var(--teal);font-weight:600;text-decoration:none}

    .msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:16px;display:none}
    .msg.error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;display:block}
    .msg.success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;display:block}

    @media(max-width:768px){body{grid-template-columns:1fr}.left{display:none}.right{padding:32px 24px}}
  </style>
</head>
<body>
  <div class="left">
    <a href="/" class="logo"><span class="logo-icon">🏦</span>UPI Savings Bank</a>
    <div class="left-middle">
      <h1 class="left-title">Welcome<br>back to<br>your <span>savings</span></h1>
      <p class="left-sub">Your goals are waiting. Every deposit brings you one step closer to what matters most.</p>
    </div>
    <div class="left-stats">
      <div><div class="left-stat-num">₹12L+</div><div class="left-stat-label">Total Saved</div></div>
      <div><div class="left-stat-num">3.4k</div><div class="left-stat-label">Goals Met</div></div>
    </div>
  </div>

  <div class="right">
    <div class="form-box">
      <h2 class="form-title">Sign in</h2>
      <p class="form-subtitle">New here? <a href="/signup">Create a free account →</a></p>

      <div id="loginForm">
        <div class="field">
          <label>Email or Username</label>
          <input type="text" id="loginId" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <div class="form-row">
          <span></span>
          <a href="/forgot-password" class="forgot">Forgot password?</a>
        </div>
        <button class="submit-btn" id="loginBtn" onclick="submitLogin()">Sign In →</button>
        <div class="msg" id="msg"></div>
      </div>

      <p class="signup-link">Don't have an account? <a href="/signup">Sign up for free</a></p>
    </div>
  </div>

  <script>
    function validateLogin() {
      const loginId  = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;
      if (!loginId)  return 'Please enter your email or username.';
      if (!password) return 'Please enter your password.';
      return null;
    }

    async function submitLogin() {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');
      msg.className = 'msg';

      const error = validateLogin();
      if (error) {
        msg.textContent = '❌ ' + error;
        msg.classList.add('error');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginId:  document.getElementById('loginId').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (data.success) {
          msg.textContent = '✅ Redirecting…';
          msg.classList.add('success');
          window.location.href = data.redirect || '/dashboard';
        } else {
          msg.textContent = '❌ ' + data.message;
          msg.classList.add('error');
          btn.disabled    = false;
          btn.textContent = 'Sign In →';
        }
      } catch (e) {
        msg.textContent = '❌ Something went wrong. Please try again.';
        msg.classList.add('error');
        btn.disabled    = false;
        btn.textContent = 'Sign In →';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });
  </script>
</body>
</html>
