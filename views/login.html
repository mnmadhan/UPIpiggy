<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UPI Savings Bank</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      overflow: hidden;
    }
    body::before, body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.6;
      animation: float 8s ease-in-out infinite alternate;
    }
    body::before { background: #3b82f6; top: -150px; left: -150px; }
    body::after  { background: #f43f5e; bottom: -150px; right: -150px; }
    @keyframes float {
      from { transform: translateY(0px); }
      to   { transform: translateY(40px); }
    }
    .login-box {
      width: 400px;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      color: white;
      transition: transform 0.4s ease;
    }
    .login-box:hover { transform: translateY(-10px); }
    h2 { margin-bottom: 25px; font-size: 28px; letter-spacing: 1px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 14px 0;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 15px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    input::placeholder { color: rgba(255,255,255,0.7); }
    input:focus { background: rgba(255,255,255,0.25); box-shadow: 0 0 10px #3b82f6; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    button:hover  { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    button:active { transform: scale(0.97); }
    p { margin-top: 20px; font-size: 14px; }
    a { color: #38bdf8; text-decoration: none; font-weight: bold; transition: 0.3s; }
    a:hover { color: #f43f5e; }
    #msg { margin-top: 12px; font-size: 14px; color: #f87171; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🏦 Login</h2>

    <form action="/login" method="POST">
      <input type="text"     name="loginId"  placeholder="Email or Username" required />
      <input type="password" name="password" placeholder="Password"          required />
      <button type="submit">Login</button>
    </form>

    <div id="msg"></div>

    <!-- FIX: forgot password link was missing -->
    <p><a href="/forgot-password">Forgot password?</a></p>
    <p>New user? <a href="/signup">Sign up</a></p>
  </div>
</body>
</html>
