<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaction History — UPI Savings Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--ink:#0a0a0f;--gold:#c9a84c;--teal:#1a7c6e;--teal-light:#2db89f;--paper:#f5f3ee;--warm:#f0ebe0;--muted:#7a7570;--border:rgba(10,10,15,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
    header{background:var(--ink);padding:18px 36px;display:flex;justify-content:space-between;align-items:center}
    header h2{font-family:'Syne',sans-serif;font-weight:800;color:var(--gold);font-size:1.1rem}
    .btn-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:8px;transition:color .2s}
    .btn-back:hover{color:white}
    .container{max-width:820px;margin:36px auto;padding:0 20px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
    .sum-box{background:white;border-radius:16px;padding:18px;border:1px solid var(--border)}
    .sum-box .s-label{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .sum-box .s-value{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem}
    .s-green{color:var(--teal)} .s-red{color:#dc2626}
    .card{background:white;border-radius:18px;padding:24px;border:1px solid var(--border)}
    .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .tab{padding:8px 16px;border-radius:100px;font-size:.82rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--warm);color:var(--muted);transition:all .2s}
    .tab.active{background:var(--ink);color:var(--gold);border-color:var(--ink)}
    .tx-list{display:flex;flex-direction:column;gap:10px}
    .tx-row{background:var(--warm);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);transition:all .2s}
    .tx-row:hover{border-color:var(--teal);transform:translateX(3px)}
    .tx-left{display:flex;align-items:center;gap:14px}
    .tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .icon-payment{background:rgba(26,124,110,.1)} .icon-withdrawal{background:rgba(245,87,108,.1)}
    .tx-goal{font-size:.88rem;font-weight:600}
    .tx-meta{font-size:.75rem;color:var(--muted);margin-top:3px}
    .badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700;margin-left:6px}
    .badge-ok{background:rgba(26,124,110,.12);color:var(--teal)}
    .badge-method{background:rgba(201,168,76,.15);color:#a07020}
    .tx-right{text-align:right}
    .tx-amount{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem}
    .tx-date{font-size:.72rem;color:var(--muted);margin-top:3px}
    .empty{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
    @media(max-width:600px){.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <h2><i class="fas fa-list"></i> Transaction History</h2>
  <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
</header>
<div class="container">
  <div class="summary">
    <div class="sum-box"><div class="s-label">Total Deposited</div><div class="s-value s-green" id="totalIn">₹0</div></div>
    <div class="sum-box"><div class="s-label">Total Withdrawn</div><div class="s-value s-red"   id="totalOut">₹0</div></div>
    <div class="sum-box"><div class="s-label">Transactions</div><div class="s-value"             id="totalCount">0</div></div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-f="all">All</button>
      <button class="tab" data-f="payment">💳 Deposits</button>
      <button class="tab" data-f="withdrawal">💸 Withdrawals</button>
    </div>
    <div class="tx-list" id="txList"><p class="empty">Loading...</p></div>
  </div>
</div>
<script>
  let allTx = [], activeFilter = 'all';

  async function loadHistory() {
    try {
      const data = await fetch('/api/history').then(r => r.json());
      allTx = data.history || [];
      const totalIn  = allTx.filter(t => t.type === 'payment').reduce((s,t)=>s+Number(t.amount),0);
      const totalOut = allTx.filter(t => t.type === 'withdrawal').reduce((s,t)=>s+Number(t.amount),0);
      document.getElementById('totalIn').textContent    = '₹' + totalIn.toLocaleString('en-IN');
      document.getElementById('totalOut').textContent   = '₹' + totalOut.toLocaleString('en-IN');
      document.getElementById('totalCount').textContent = allTx.length;
      renderList(allTx);
    } catch(e) { document.getElementById('txList').innerHTML = '<p class="empty">Failed to load history.</p>'; }
  }

  function renderList(txs) {
    const list = document.getElementById('txList');
    if (!txs.length) { list.innerHTML = '<p class="empty">No transactions found.</p>'; return; }
    list.innerHTML = txs.map(tx => {
      const isPayment   = tx.type === 'payment';
      const amtColor    = isPayment ? 'var(--teal)' : '#dc2626';
      const sign        = isPayment ? '+' : '-';
      const icon        = isPayment ? '💳' : '💸';
      const iconClass   = isPayment ? 'icon-payment' : 'icon-withdrawal';
      const date        = new Date(tx.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const methodBadge = isPayment ? `<span class="badge badge-method">${tx.method}</span>` : '';
      const note        = tx.note ? ` · <em>${tx.note}</em>` : '';
      return `
        <div class="tx-row">
          <div class="tx-left">
            <div class="tx-icon ${iconClass}">${icon}</div>
            <div>
              <div class="tx-goal">${tx.goal_name}</div>
              <div class="tx-meta">${isPayment ? 'Deposit' : 'Withdrawal'}${note}${methodBadge}<span class="badge badge-ok">${tx.status}</span></div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:${amtColor}">${sign}₹${Number(tx.amount).toLocaleString('en-IN')}</div>
            <div class="tx-date">${date}</div>
          </div>
        </div>`;
    }).join('');
  }

  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.f;
    renderList(activeFilter === 'all' ? allTx : allTx.filter(t => t.type === activeFilter));
  }));

  loadHistory();
</script>
</body>
</html>
