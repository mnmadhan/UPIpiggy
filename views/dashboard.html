<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - UPI Savings Bank</title>

  <!-- ✅ Correct CSS File -->
  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 0;
    }

    /* HEADER */
    header {
      background: #2c3e50;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: red;
      padding: 8px 15px;
      border-radius: 6px;
    }

    /* MAIN CONTAINER */
    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    /* CARD DESIGN */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* FORM INPUTS */
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    /* BUTTON */
    button {
      padding: 10px 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3498db;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      background: #217dbb;
    }

    /* GOAL BOX */
    .goal {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    /* PROGRESS BAR */
    .progress-bar {
      width: 100%;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 12px;
      background: green;
      width: 0%;
      transition: 0.4s;
    }

    .goal p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
  <div>
    <h2>🏦 UPI Savings Dashboard</h2>
    <p id="welcomeText" style="margin:0; font-size:14px; color:#ddd;">
      Loading user...
    </p>
  </div>

  <a href="/logout">Logout</a>
</header>


  <div class="container">

    <!-- CREATE GOAL -->
    <div class="card">
      <h3>🎯 Create Savings Goal</h3>

      <form action="/add-goal" method="POST">
        <input
          type="text"
          name="goalName"
          placeholder="Enter Goal Name"
          required
        />

        <input
          type="number"
          name="targetAmount"
          placeholder="Enter Target Amount ₹"
          required
        />

        <button type="submit">➕ Add Goal</button>
      </form>
    </div>

    <!-- GOALS LIST -->
    <div class="card">
      <h3>💰 Your Savings Goals</h3>

      <div id="goalsContainer">
        <p>Loading goals...</p>
      </div>
    </div>

  </div>

  <script>
    async function loadUser() {
  try {
    const res = await fetch("/api/user");
    const user = await res.json();

    document.getElementById("welcomeText").innerHTML =
      `👤 Logged in as <b>${user.username}</b> (${user.email})`;

  } catch (err) {
    document.getElementById("welcomeText").innerText =
      "User info not available";
  }
}

  async function loadGoals() {
    const container = document.getElementById("goalsContainer");

    try {
      const res = await fetch("/api/goals");
      const goals = await res.json();

      if (goals.length === 0) {
        container.innerHTML = "<p>No savings goals created yet.</p>";
        return;
      }

      container.innerHTML = "";

      goals.forEach(goal => {
        const progress = Math.min(
          (goal.current_amount / goal.target_amount) * 100,
          100
        );

        const div = document.createElement("div");
        div.classList.add("goal");

        div.innerHTML = `
          <h4>🎯 ${goal.goal_name}</h4>

          <p><b>Target:</b> ₹${goal.target_amount}</p>
          <p><b>Saved:</b> ₹${goal.current_amount}</p>

          <div class="progress-bar">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>

          <p><b>Progress:</b> ${progress.toFixed(1)}%</p>

          <!-- ✅ No inline onclick -->
          <button class="payBtn" data-id="${goal.id}">
            💳 Add Money via Payment
          </button>
        `;

        container.appendChild(div);
      });

      // ✅ Add click listeners safely
      document.querySelectorAll(".payBtn").forEach(btn => {
        btn.addEventListener("click", function () {
          const goalId = this.getAttribute("data-id");
          window.location.href = `/payment?goalId=${goalId}`;
        });
      });

    } catch (err) {
      console.error(err);
      container.innerHTML =
        "<p style='color:red;'>❌ Failed to load goals</p>";
    }
  }
  loadUser();
  loadGoals();
</script>

</body>
</html>
