<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - UPI Savings Bank</title>

  <!-- ✅ Correct CSS File -->
  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  margin: 0;
  padding: 0;
  color: white;
}

/* ================= HEADER ================= */
header {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

header h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  background: linear-gradient(135deg, #ff4e50, #f9d423);
  padding: 8px 18px;
  border-radius: 20px;
  transition: all 0.3s ease;
}

header a:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* ================= MAIN CONTAINER ================= */
.container {
  width: 90%;
  max-width: 900px;
  margin: 40px auto;
}

/* ================= CARD DESIGN ================= */
.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 20px;
  margin-bottom: 25px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  transition: transform 0.4s ease;
}

.card:hover {
  transform: translateY(-8px);
}

/* ================= INPUT ================= */
input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  background: rgba(255,255,255,0.15);
  color: white;
  outline: none;
  transition: all 0.3s ease;
}

input::placeholder {
  color: rgba(255,255,255,0.7);
}

input:focus {
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

/* ================= BUTTON ================= */
button {
  padding: 12px 18px;
  margin-top: 10px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  background: linear-gradient(135deg, #36d1dc, #5b86e5);
  color: white;
  font-weight: bold;
  font-size: 15px;
  transition: all 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

button:active {
  transform: scale(0.95);
}

/* ================= GOAL BOX ================= */
.goal {
  background: rgba(255,255,255,0.1);
  padding: 18px;
  border-radius: 18px;
  margin-top: 20px;
  transition: transform 0.3s ease;
}

.goal:hover {
  transform: translateX(6px);
}

/* ================= PROGRESS BAR ================= */
.progress-bar {
  width: 100%;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
  height: 14px;
}

.progress-fill {
  height: 14px;
  background: linear-gradient(90deg, #00f260, #0575e6);
  width: 0%;
  border-radius: 20px;
  transition: width 0.6s ease-in-out;
}

/* ================= GOAL TEXT ================= */
.goal p {
  margin: 6px 0;
  font-size: 14px;
  opacity: 0.9;
}
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
  <div>
    <h2>🏦 UPI Savings Dashboard</h2>
    <p id="welcomeText" style="margin:0; font-size:14px; color:#ddd;">
      Loading user...
    </p>
  </div>

  <a href="/logout">Logout</a>
</header>


  <div class="container">

    <!-- CREATE GOAL -->
    <div class="card">
      <h3>🎯 Create Savings Goal</h3>

      <form action="/add-goal" method="POST">
        <input
          type="text"
          name="goalName"
          placeholder="Enter Goal Name"
          required
        />

        <input
          type="number"
          name="targetAmount"
          placeholder="Enter Target Amount ₹"
          required
        />

        <button type="submit">➕ Add Goal</button>
      </form>
    </div>

    <!-- GOALS LIST -->
    <div class="card">
      <h3>💰 Your Savings Goals</h3>

      <div id="goalsContainer">
        <p>Loading goals...</p>
      </div>
    </div>

  </div>

  <script>
    async function loadUser() {
  try {
    const res = await fetch("/api/user");
    const user = await res.json();

    document.getElementById("welcomeText").innerHTML =
      `👤 Logged in as <b>${user.username}</b> (${user.email})`;

  } catch (err) {
    document.getElementById("welcomeText").innerText =
      "User info not available";
  }
}

  async function loadGoals() {
    const container = document.getElementById("goalsContainer");

    try {
      const res = await fetch("/api/goals");
      const goals = await res.json();

      if (goals.length === 0) {
        container.innerHTML = "<p>No savings goals created yet.</p>";
        return;
      }

      container.innerHTML = "";

      goals.forEach(goal => {
        const progress = Math.min(
          (goal.current_amount / goal.target_amount) * 100,
          100
        );

        const div = document.createElement("div");
        div.classList.add("goal");

        div.innerHTML = `
          <h4>🎯 ${goal.goal_name}</h4>

          <p><b>Target:</b> ₹${goal.target_amount}</p>
          <p><b>Saved:</b> ₹${goal.current_amount}</p>

          <div class="progress-bar">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>

          <p><b>Progress:</b> ${progress.toFixed(1)}%</p>

          <!-- ✅ No inline onclick -->
          <button class="payBtn" data-id="${goal.id}">
            💳 Add Money via Payment
          </button>
        `;

        container.appendChild(div);
      });

      // ✅ Add click listeners safely
      document.querySelectorAll(".payBtn").forEach(btn => {
        btn.addEventListener("click", function () {
          const goalId = this.getAttribute("data-id");
          window.location.href = `/payment?goalId=${goalId}`;
        });
      });

    } catch (err) {
      console.error(err);
      container.innerHTML =
        "<p style='color:red;'>❌ Failed to load goals</p>";
    }
  }
  loadUser();
  loadGoals();
</script>

</body>
</html>
