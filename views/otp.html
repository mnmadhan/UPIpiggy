<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification - UPI Money Bank</title>

  <style>
   body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  overflow: hidden;
  position: relative;
}

/* Animated rotating background ring */
body::before {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,0.1);
  animation: rotate 20s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ================= OTP CONTAINER ================= */
.otp-container {
  background: #111827;
  padding: 40px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  color: white;
  position: relative;
  z-index: 2;
  transition: transform 0.4s ease;
}

.otp-container:hover {
  transform: translateY(-8px);
}

/* ================= INPUT ================= */
input {
  width: 100%;
  padding: 16px;
  margin: 15px 0;
  border: none;
  border-radius: 12px;
  font-size: 22px;
  text-align: center;
  letter-spacing: 12px;
  background: #1f2937;
  color: #38bdf8;
  outline: none;
  transition: all 0.3s ease;
}

input:focus {
  background: #0ea5e9;
  color: white;
  box-shadow: 0 0 20px #0ea5e9;
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: linear-gradient(135deg, #06b6d4, #3b82f6);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

button:active {
  transform: scale(0.97);
}

/* ================= MESSAGE ================= */
#msg {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.8;
  transition: all 0.3s ease;
}
  </style>
</head>

<body>

  <div class="otp-container">
    <h2>🔐 Verify OTP</h2>

    <form id="otpForm">
      <input type="text" id="otp" placeholder="Enter OTP" required maxlength="6" />
      <button type="submit">Verify OTP</button>
    </form>

    <div id="msg"></div>
  </div>

  <script>
    document.getElementById("otpForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const otp = document.getElementById("otp").value.trim();
      const msg = document.getElementById("msg");

      msg.innerHTML = "⏳ Verifying OTP...";

      try {
        const res = await fetch("/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ otp })
        });

        const data = await res.json();

        if (data.success) {
          msg.innerHTML = `<p style="color:green;">✅ ${data.message}</p>`;

          // ✅ Redirect to Dashboard
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 1200);

        } else {
          msg.innerHTML = `<p style="color:red;">❌ ${data.message}</p>`;
        }

      } catch (err) {
        console.error(err);
        msg.innerHTML = `<p style="color:red;">Something went wrong!</p>`;
      }
    });
  </script>

</body>
</html>
