<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — UPI Savings Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0a0f;--gold:#c9a84c;--teal:#1a7c6e;--teal-light:#2db89f;--paper:#f5f3ee}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;top:-150px;left:-150px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(26,124,110,.25),transparent 70%)}
    body::after{content:'';position:absolute;bottom:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.15),transparent 70%)}

    .card{background:var(--paper);border-radius:28px;padding:52px 44px;width:100%;max-width:440px;text-align:center;position:relative;z-index:1;animation:slideUp .5s ease both}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

    .otp-icon{width:72px;height:72px;border-radius:20px;background:var(--ink);display:grid;place-items:center;font-size:32px;margin:0 auto 28px}
    .card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;color:var(--ink);margin-bottom:8px}
    .card-sub{font-size:.9rem;color:#7a7570;line-height:1.6;margin-bottom:36px}

    /* OTP BOXES */
    .otp-inputs{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
    .otp-digit{width:52px;height:60px;border:2px solid rgba(10,10,15,.15);border-radius:14px;text-align:center;font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:700;color:var(--ink);background:white;outline:none;transition:border-color .2s,box-shadow .2s;caret-color:transparent}
    .otp-digit:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,124,110,.12)}
    .otp-digit.filled{border-color:var(--teal);background:rgba(26,124,110,.05)}
    .otp-digit.error-box{border-color:#ef4444;background:rgba(239,68,68,.05);animation:shake .3s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

    .attempts-bar{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
    .attempt-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);transition:background .3s}
    .attempt-dot.used{background:#ef4444}

    .timer{font-size:.85rem;color:#7a7570;margin-bottom:20px}
    .timer span{color:var(--teal);font-weight:600}
    .timer.expired span{color:#ef4444}

    .submit-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--ink);color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all .25s;margin-bottom:16px}
    .submit-btn:hover:not(:disabled){background:#1a1a2e;transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,10,15,.2)}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .resend-btn{background:none;border:none;color:var(--teal);font-size:.88rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0}
    .resend-btn:disabled{color:#bbb;cursor:not-allowed}

    .back-link{display:block;margin-top:18px;font-size:.82rem;color:#7a7570;text-decoration:none}
    .back-link:hover{color:var(--ink)}

    .msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:12px;display:none}
    .msg.error{background:#fee2e2;color:#991b1b;display:block}
    .msg.success{background:#d1fae5;color:#065f46;display:block}
  </style>
</head>
<body>
  <div class="card">
    <div class="otp-icon">🔐</div>
    <h2 class="card-title">Verify your email</h2>
    <p class="card-sub">We sent a 6-digit code to your email.<br>Enter it below to activate your account.</p>

    <div class="otp-inputs" id="otpBoxes">
      <input class="otp-digit" maxlength="1" data-idx="0" inputmode="numeric" autocomplete="one-time-code">
      <input class="otp-digit" maxlength="1" data-idx="1" inputmode="numeric">
      <input class="otp-digit" maxlength="1" data-idx="2" inputmode="numeric">
      <input class="otp-digit" maxlength="1" data-idx="3" inputmode="numeric">
      <input class="otp-digit" maxlength="1" data-idx="4" inputmode="numeric">
      <input class="otp-digit" maxlength="1" data-idx="5" inputmode="numeric">
    </div>

    <!-- Visual attempt tracker: 5 dots, turn red on each failed attempt -->
    <div class="attempts-bar" id="attemptsBar">
      <div class="attempt-dot" id="dot0"></div>
      <div class="attempt-dot" id="dot1"></div>
      <div class="attempt-dot" id="dot2"></div>
      <div class="attempt-dot" id="dot3"></div>
      <div class="attempt-dot" id="dot4"></div>
    </div>

    <div class="timer" id="timerEl">Code expires in <span id="countdown">5:00</span></div>

    <button class="submit-btn" id="verifyBtn" onclick="verifyOtp()">Verify & Continue →</button>
    <div>
      <button class="resend-btn" id="resendBtn" disabled onclick="resendOtp()">Resend code</button>
    </div>
    <a class="back-link" href="/signup">← Back to sign up</a>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const digits = Array.from(document.querySelectorAll('.otp-digit'));
    let failedAttempts = 0;
    const MAX_ATTEMPTS = 5;

    /* ── OTP box keyboard behaviour ── */
    digits.forEach((el, i) => {
      el.addEventListener('input', () => {
        el.value = el.value.replace(/\D/g, '').slice(-1);
        if (el.value && i < 5) digits[i + 1].focus();
        el.classList.toggle('filled', !!el.value);
        el.classList.remove('error-box');
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !el.value && i > 0) {
          digits[i - 1].focus();
          digits[i - 1].value = '';
          digits[i - 1].classList.remove('filled', 'error-box');
        }
        // Submit on Enter when all 6 filled
        if (e.key === 'Enter') verifyOtp();
      });
      el.addEventListener('paste', e => {
        e.preventDefault();
        const paste = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
        paste.split('').forEach((ch, j) => {
          if (digits[j]) { digits[j].value = ch; digits[j].classList.add('filled'); digits[j].classList.remove('error-box'); }
        });
        if (paste.length < 6) digits[paste.length]?.focus();
        else digits[5].focus();
      });
    });

    function getOtp() {
      return digits.map(d => d.value).join('');
    }

    function markBoxesError() {
      digits.forEach(d => { d.classList.add('error-box'); d.classList.remove('filled'); });
      setTimeout(() => digits.forEach(d => d.classList.remove('error-box')), 600);
    }

    function clearBoxes() {
      digits.forEach(d => { d.value = ''; d.classList.remove('filled', 'error-box'); });
      digits[0].focus();
    }

    function markAttemptUsed(n) {
      // n = number of attempts used so far (1-indexed)
      for (let i = 0; i < n && i < MAX_ATTEMPTS; i++) {
        document.getElementById('dot' + i)?.classList.add('used');
      }
    }

    /* ── Countdown timer ── */
    let secs = 300; // 5 min — matches server session
    let timerInterval;

    function tick() {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if (secs-- <= 0) {
        clearInterval(timerInterval);
        document.getElementById('countdown').textContent = '0:00';
        document.getElementById('timerEl').classList.add('expired');
        document.getElementById('resendBtn').disabled = false;
        document.getElementById('verifyBtn').disabled = true;
        showMsg('Your OTP has expired. Please resend.', 'error');
      }
    }
    timerInterval = setInterval(tick, 1000);
    tick(); // run immediately so we don't wait 1 s for first render

    /* ── Verify OTP ── */
    async function verifyOtp() {
      const otp = getOtp();
      const btn = document.getElementById('verifyBtn');

      clearMsg();

      if (otp.length !== 6) {
        showMsg('Please enter all 6 digits.', 'error');
        digits[otp.length]?.focus();
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Verifying…';

      try {
        const res  = await fetch('/verify-otp', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ otp }),
        });
        const data = await res.json();

        if (data.success) {
          showMsg('✅ ' + data.message, 'success');
          clearInterval(timerInterval);
          setTimeout(() => window.location.href = data.redirect || '/login', 1400);
        } else {
          failedAttempts++;
          markAttemptUsed(failedAttempts);
          markBoxesError();
          clearBoxes();
          showMsg('❌ ' + data.message, 'error');

          // Server says too many attempts or sends a redirect
          if (data.redirect) {
            setTimeout(() => window.location.href = data.redirect, 2000);
          } else {
            btn.disabled    = false;
            btn.textContent = 'Verify & Continue →';
          }
        }
      } catch (e) {
        showMsg('Something went wrong. Please try again.', 'error');
        btn.disabled    = false;
        btn.textContent = 'Verify & Continue →';
      }
    }

    /* ── Resend OTP ── */
    async function resendOtp() {
      const resendBtn = document.getElementById('resendBtn');
      clearMsg();
      resendBtn.disabled    = true;
      resendBtn.textContent = 'Sending…';

      try {
        const res  = await fetch('/resend-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();

        if (data.success) {
          showMsg('✅ ' + data.message, 'success');
          // Reset timer and attempt dots
          secs = 300;
          failedAttempts = 0;
          clearInterval(timerInterval);
          timerInterval = setInterval(tick, 1000);
          document.getElementById('timerEl').classList.remove('expired');
          document.getElementById('verifyBtn').disabled = false;
          for (let i = 0; i < 5; i++) document.getElementById('dot' + i)?.classList.remove('used');
          clearBoxes();
        } else {
          showMsg('❌ ' + (data.message || 'Failed to resend.'), 'error');
          resendBtn.disabled = false;
          if (data.redirect) setTimeout(() => window.location.href = data.redirect, 1800);
        }
      } catch (e) {
        showMsg('Could not resend. Please try again.', 'error');
        resendBtn.disabled = false;
      }
      resendBtn.textContent = 'Resend code';
    }

    /* ── Message helpers ── */
    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent  = text;
      el.className    = 'msg ' + type;
    }
    function clearMsg() {
      const el = document.getElementById('msg');
      el.className    = 'msg';
      el.textContent  = '';
    }

    // Auto-focus first box on load
    digits[0].focus();
  </script>
</body>
</html>
