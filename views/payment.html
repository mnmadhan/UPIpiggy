<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - UPI Savings Bank</title>

  <style>
    body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */
header {
  background: transparent;
  color: white;
  padding: 25px;
  text-align: center;
  font-size: 22px;
  letter-spacing: 1px;
  font-weight: 600;
}

/* ================= CONTAINER ================= */
.container {
  width: 90%;
  max-width: 500px;
  margin: 40px auto;
  padding: 35px;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(18px);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
  color: white;
  transition: transform 0.4s ease;
}

.container:hover {
  transform: translateY(-8px);
}

/* ================= LABEL ================= */
label {
  font-weight: 600;
  display: block;
  margin-top: 20px;
  font-size: 14px;
  letter-spacing: 0.5px;
}

/* ================= INPUTS ================= */
input,
select {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.25);
  color: white;
  font-size: 14px;
  transition: all 0.3s ease;
}

input::placeholder {
  color: rgba(255,255,255,0.8);
}

input:focus,
select:focus {
  background: rgba(255,255,255,0.4);
  box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  border: none;
  border-radius: 14px;
  color: #333;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

button:active {
  transform: scale(0.97);
}

/* ================= BACK LINK ================= */
.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  text-decoration: none;
  font-weight: bold;
  color: white;
  transition: 0.3s;
}

.back:hover {
  letter-spacing: 1px;
}

/* ================= GOAL BOX ================= */
.goal-box {
  background: rgba(255,255,255,0.25);
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
  font-size: 14px;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

.goal-box:hover {
  background: rgba(255,255,255,0.4);
}
  </style>
</head>

<body>

  <header>
    <h1>💳 UPI Payment Page</h1>
  </header>

  <div class="container">
    <h2>Make a Payment</h2>

    <!-- Goal Info -->
    <div class="goal-box">
      <p><b>Selected Goal ID:</b> <span id="goalIdText"></span></p>
    </div>

    <!-- Payment Form -->
    <form action="/payment" method="POST">

      <!-- Hidden Goal ID -->
      <input type="hidden" name="goalId" id="goalIdInput" />

      <!-- Amount -->
      <label>Enter Amount (₹)</label>
      <input type="number" name="amount" required min="1" />

      <!-- Payment Method -->
      <label>Select Payment Method</label>
      <select name="method" required>
        <option value="">-- Choose Method --</option>
        <option value="UPI">UPI</option>
        <option value="Debit Card">Debit Card</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Net Banking">Net Banking</option>
      </select>

      <button type="submit">✅ Pay Now</button>
    </form>

    <a href="/dashboard" class="back">⬅ Back to Dashboard</a>
  </div>

  <script>
    // ✅ Get goalId from URL
    const params = new URLSearchParams(window.location.search);
    const goalId = params.get("goalId");

    if (!goalId) {
      alert("❌ No goal selected. Redirecting...");
      window.location.href = "/dashboard";
    }

    // Show goalId
    document.getElementById("goalIdText").innerText = goalId;

    // Set hidden field
    document.getElementById("goalIdInput").value = goalId;
  </script>

</body>
</html>
