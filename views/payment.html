<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - UPI Savings Bank</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #3498db;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #217dbb;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #2c3e50;
    }

    .goal-box {
      background: #eef;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💳 UPI Payment Page</h1>
  </header>

  <div class="container">
    <h2>Make a Payment</h2>

    <!-- Goal Info -->
    <div class="goal-box">
      <p><b>Selected Goal ID:</b> <span id="goalIdText"></span></p>
    </div>

    <!-- Payment Form -->
    <form action="/payment" method="POST">

      <!-- Hidden Goal ID -->
      <input type="hidden" name="goalId" id="goalIdInput" />

      <!-- Amount -->
      <label>Enter Amount (₹)</label>
      <input type="number" name="amount" required min="1" />

      <!-- Payment Method -->
      <label>Select Payment Method</label>
      <select name="method" required>
        <option value="">-- Choose Method --</option>
        <option value="UPI">UPI</option>
        <option value="Debit Card">Debit Card</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Net Banking">Net Banking</option>
      </select>

      <button type="submit">✅ Pay Now</button>
    </form>

    <a href="/dashboard" class="back">⬅ Back to Dashboard</a>
  </div>

  <script>
    // ✅ Get goalId from URL
    const params = new URLSearchParams(window.location.search);
    const goalId = params.get("goalId");

    if (!goalId) {
      alert("❌ No goal selected. Redirecting...");
      window.location.href = "/dashboard";
    }

    // Show goalId
    document.getElementById("goalIdText").innerText = goalId;

    // Set hidden field
    document.getElementById("goalIdInput").value = goalId;
  </script>

</body>
</html>
