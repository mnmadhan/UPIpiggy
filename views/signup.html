<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - UPI Money Bank</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #1e3c72, #2a5298);
      overflow: hidden;
      position: relative;
    }
    body::before, body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(80px);
    }
    body::before { background: #ff6a00; top: -100px; left: -100px; }
    body::after  { background: #00f5a0; bottom: -100px; right: -100px; }
    .signup-container {
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      position: relative;
      z-index: 2;
    }
    .signup-container h2 { margin-bottom: 20px; font-size: 26px; font-weight: 700; color: #1e3c72; }
    .signup-container input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      background: #f1f5f9;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .signup-container input:focus {
      outline: none;
      background: #e0f2fe;
      box-shadow: 0 0 12px rgba(30,60,114,0.4);
    }
    /* label for date-of-birth */
    .field-label {
      display: block;
      text-align: left;
      font-size: 12px;
      color: #555;
      margin: 6px 0 2px 4px;
    }
    .signup-container button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .signup-container button:hover  { transform: scale(1.05); box-shadow: 0 12px 25px rgba(0,0,0,0.3); }
    .signup-container button:active { transform: scale(0.96); }
    .signup-container p  { margin-top: 16px; font-size: 14px; color: #555; }
    .signup-container a  { color: #0072ff; font-weight: 600; text-decoration: none; }
    .signup-container a:hover { color: #00c6ff; }
    #msg { margin-top: 12px; font-weight: bold; color: #ff3b3b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>📝 Create Account</h2>

    <form id="signupForm" method="POST" action="/signup">

      <input type="text"  name="username" placeholder="Username" required />
      <input type="email" name="email"    placeholder="Email"    required />

      <!-- FIX: phone and dob were in the form before but missing here -->
      <input type="tel"  name="phone" placeholder="Phone number (optional)" />

      <label class="field-label">Date of Birth</label>
      <input type="date" name="dob" />

      <input type="password" name="password"        id="password"        placeholder="Password"         required />
      <input type="password" id="confirmPassword"                         placeholder="Confirm Password" required />

      <button type="submit">Sign Up</button>
      <div id="msg"></div>
    </form>

    <p>Already have an account? <a href="/login">Login</a></p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      const pass    = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const msg     = document.getElementById("msg");

      if (pass !== confirm) {
        e.preventDefault();
        msg.innerHTML = "❌ Passwords do not match!";
      }
    });
  </script>
</body>
</html>
