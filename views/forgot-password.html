<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — UPI Savings Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0a0f;--gold:#c9a84c;--teal:#1a7c6e;--paper:#f5f3ee;--muted:#7a7570;--border:rgba(10,10,15,.12)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;top:-120px;right:-120px;width:450px;height:450px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.15),transparent 70%)}
    body::after{content:'';position:absolute;bottom:-80px;left:-80px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(26,124,110,.2),transparent 70%)}

    .card{background:var(--paper);border-radius:28px;padding:52px 44px;width:100%;max-width:420px;text-align:center;position:relative;z-index:1;animation:slideUp .5s ease both}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

    .card-icon{width:70px;height:70px;border-radius:20px;background:var(--ink);display:grid;place-items:center;font-size:28px;margin:0 auto 24px}
    .card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;color:var(--ink);margin-bottom:8px}
    .card-sub{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:32px}

    .field{margin-bottom:16px;text-align:left}
    .field label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.07em;color:var(--ink);margin-bottom:8px;text-transform:uppercase}
    .field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;font-family:'DM Sans',sans-serif;background:white;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,124,110,.12)}
    .field input::placeholder{color:#bbb}

    .submit-btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--ink);color:var(--gold);font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .25s;margin-bottom:16px}
    .submit-btn:hover{background:#1a1a2e;transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,10,15,.2)}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .back-link{font-size:.85rem;color:var(--muted)}
    .back-link a{color:var(--teal);font-weight:600;text-decoration:none}

    .msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;text-align:left;display:none}
    .msg.error{background:#fee2e2;color:#991b1b;display:block}
    .msg.success{background:#d1fae5;color:#065f46;display:block}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-icon">🔑</div>
    <h2 class="card-title">Reset Password</h2>
    <p class="card-sub">Enter your email address and we'll send you a one-time password to reset your account.</p>

    <div class="msg" id="msg"></div>

    <form id="forgotForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Send Reset Code →</button>
    </form>
    <p class="back-link">Remember your password? <a href="/login">Back to login</a></p>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async(e)=>{
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      msg.className='msg';
      btn.disabled=true; btn.textContent='Sending...';
      try {
        const res = await fetch('/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});
        const data = await res.json();
        msg.textContent = data.message;
        msg.classList.add(data.success?'success':'error');
        if (data.success) setTimeout(()=>window.location.href='/reset-password',1500);
        else { btn.disabled=false; btn.textContent='Send Reset Code →'; }
      } catch(err) {
        msg.textContent='Something went wrong. Please try again.'; msg.classList.add('error');
        btn.disabled=false; btn.textContent='Send Reset Code →';
      }
    });
  </script>
</body>
</html>
